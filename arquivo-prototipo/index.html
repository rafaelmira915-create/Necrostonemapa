<!doctype html><html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arquivo Necrostone — Future Index</title><style>*{box-sizing:border-box}body{margin:0;background:#0e0c13;color:#f5f1f8;font-family:system-ui,sans-serif}header{padding:24px 5%;border-bottom:1px solid #3b3047;display:flex;align-items:center;gap:15px}header img{width:46px;height:46px;object-fit:contain;border-radius:50%}.brand{letter-spacing:3px;font-weight:700}.hero{padding:48px 5%;background:radial-gradient(ellipse at right,#332044,#100e16 65%)}h1{font-weight:400;font-size:clamp(30px,5vw,55px);margin:0}.layout{display:grid;grid-template-columns:260px 1fr;gap:25px;padding:24px 5%}aside{background:#191421;border:1px solid #463352;border-radius:14px;padding:20px;height:max-content}h2{font-size:18px;font-weight:500}label{display:block;color:#c5b4ce;font-size:12px;margin:15px 0 6px}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #5a4566;background:#241b2c;color:white}.pair{display:flex;gap:7px}.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.card{border:1px solid #4b3956;border-radius:12px;overflow:hidden;background:#1c1624}.portrait{height:150px;background:linear-gradient(125deg,#302439,#17121e);display:grid;place-items:center;font:46px Georgia,serif;color:#766583}.body{padding:16px}.body h3{margin:0 0 10px;font-weight:500}.body p{color:#c2b7c8;font-size:13px}.hint{font-size:13px;color:#b6a6bf;line-height:1.6}.tag{border:1px solid #624975;border-radius:18px;padding:5px 9px;font-size:11px;display:inline-block;margin:3px}button{background:#59316e;border:1px solid #8956a7;border-radius:8px;padding:11px 18px;color:white;cursor:pointer;margin-top:15px}@media(max-width:700px){.layout{grid-template-columns:1fr}} .hero-title{display:flex;align-items:center;gap:18px}.hero-title img{width:64px;height:64px;object-fit:contain;border-radius:50%}@media(max-width:600px){.hero-title img{width:48px;height:48px}} </style><section class="hero"><div class="hero-title"><img src="https://assets.softr-files.com/applications/9ce3d56b-4ec6-4d62-ba5c-05f74c52fae8/assets/91864277-711e-45bb-a4c2-e9c0b56f0876.jpeg" alt="Logótipo Necrostone"><h1>Arquivo Necrostone</h1></div></section><div class="layout"><aside><h2>Pesquisa avançada</h2><label>Nome</label><input placeholder="Pesquisar por nome" id="nome"><label>Área / profissão</label><select id="area"><option>Todas</option></select><label>Cemitério</label><select id="cem"><option>Todos</option></select><label>Rota temática</label><select id="rota"><option>Todas</option></select><label>Nascimento — de / até</label><div class="pair"><input type="number" placeholder="Ano" id="n1"><input type="number" placeholder="Ano" id="n2"></div><label>Morte — de / até</label><div class="pair"><input type="number" placeholder="Ano" id="m1"><input type="number" placeholder="Ano" id="m2"></div><button id="clear">Limpar filtros</button></aside><main><p id="status" class="hint">A preparar ligação ao arquivo...</p><div id="results" class="results"></div></main></div><script>let records=[];const $=x=>document.getElementById(x);const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const list=(v)=>Array.isArray(v)?v:[];function year(v){const m=String(v||'').match(/\b(1[0-9]{3}|20[0-9]{2})\b/);return m?+m[1]:null}function fits(y,a,b){return !a&&!b||y!==null&&(!a||y>=+a)&&(!b||y<=+b)}function fill(id,key){for(const x of [...new Set(records.flatMap(r=>list(r[key])))].sort()){const o=document.createElement('option');o.value=x;o.textContent=x;$(id).append(o)}}function render(){const data=records.filter(r=>norm(r.nome).includes(norm($('nome').value))&&(!$('area').value||$('area').value==='Todas'||list(r.areas).includes($('area').value))&&(!$('cem').value||$('cem').value==='Todos'||list(r.cemiterios).includes($('cem').value))&&(!$('rota').value||$('rota').value==='Todas'||list(r.rotas).includes($('rota').value))&&fits(year(r.nascimento),$('n1').value,$('n2').value)&&fits(year(r.morte),$('m1').value,$('m2').value));$('status').textContent=data.length+' de '+records.length+' registos disponíveis';$('results').replaceChildren();for(const r of data){const card=document.createElement('article');card.className='card';const pic=document.createElement('div');pic.className='portrait';pic.textContent='◈';if(r.foto&&/^https:\/\//.test(r.foto)){const img=document.createElement('img');img.src=r.foto;img.alt='Retrato de '+r.nome;img.style.cssText='width:100%;height:150px;object-fit:cover';pic.replaceChildren(img)}const body=document.createElement('div');body.className='body';const h=document.createElement('h3');h.textContent=r.nome;body.append(h);for(const a of list(r.areas)){const t=document.createElement('span');t.className='tag';t.textContent=a;body.append(t)}const p=document.createElement('p');p.textContent=list(r.cemiterios).join(' · ')||'Cemitério não indicado';body.append(p);const dates=document.createElement('p');dates.textContent=(r.nascimento||'?')+' — '+(r.morte||'?');body.append(dates);card.append(pic,body);$('results').append(card)}}async function init(){try{const res=await fetch('./dados-publicos.json',{cache:'no-store'});if(!res.ok)throw Error('Sem ficheiro de dados');const data=await res.json();if(!Array.isArray(data))throw Error('Formato inválido');records=data;fill('area','areas');fill('cem','cemiterios');fill('rota','rotas');render()}catch(e){$('status').textContent='A interface está publicada. A ligação segura aos registos do Notion ainda não foi configurada. Não são apresentados dados fictícios.'}}for(const id of ['nome','area','cem','rota','n1','n2','m1','m2'])$(id).addEventListener('input',render);$('clear').onclick=()=>{for(const id of ['nome','area','cem','rota','n1','n2','m1','m2'])$(id).value='';render()};init();</script></html>

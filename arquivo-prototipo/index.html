eight:clamp(21px,3.4vh,30px);min-height:0;padding:2px 6px;font-size:11px}.layout aside .pair{gap:5px}.layout aside button{height:clamp(23px,3.5vh,30px);padding:2px;margin:4px 0 0;font-size:11px;flex-shrink:0}@media(max-height:690px){.layout aside{padding:5px 8px}.layout aside h2{font-size:12px}.layout aside label{font-size:9px;margin:1px 0}.layout aside input,.layout aside select{height:22px}.layout aside button{height:23px}}  .card{cursor:pointer;transition:border-color .15s,transform .15s}.card:hover,.card:focus-visible{border-color:#b88bd5;transform:translateY(-2px);outline:none}.detail-overlay{position:fixed;inset:0;background:#08060bdc;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}.detail-overlay.open{display:flex}.detail-panel{background:#1d1625;border:1px solid #76558b;border-radius:16px;width:min(650px,100%);max-height:90vh;overflow:auto;padding:22px;position:relative}.detail-panel h2{font-size:25px;margin:8px 35px 18px 0}.detail-panel p{line-height:1.6;color:#d7cddd}.detail-panel img{width:100%;max-height:290px;object-fit:contain;background:#120e18;border-radius:9px}.detail-close{position:absolute;right:15px;top:8px;background:transparent;border:0;font-size:28px;padding:0 8px}.detail-row{border-top:1px solid #403248;padding:10px 0}.detail-row strong{color:#bca3ce;display:block;font-size:12px;margin-bottom:3px}</style><section class="hero"><div class="hero-title"><img src="https://assets.softr-files.com/applications/9ce3d56b-4ec6-4d62-ba5c-05f74c52fae8/assets/91864277-711e-45bb-a4c2-e9c0b56f0876.jpeg" alt="Logótipo Necrostone"><h1>Arquivo Necrostone</h1></div></section><div class="layout"><aside><h2>Pesquisa avançada</h2><label>Nome</label><input placeholder="Pesquisar por nome" id="nome"><label>Área / profissão</label><select id="area"><option>Todas</option></select><label>Cemitério</label><select id="cem"><option>Todos</option></select><label>Rota temática</label><select id="rota"><option>Todas</option></select><label>Nascimento — de / até</label><div class="pair"><input type="number" placeholder="Ano" id="n1"><input type="number" placeholder="Ano" id="n2"></div><label>Morte — de / até</label><div class="pair"><input type="number" placeholder="Ano" id="m1"><input type="number" placeholder="Ano" id="m2"></div><button id="clear">Limpar filtros</button></aside><main><p id="status" class="hint">A preparar ligação ao arquivo...</p><div id="results" class="results"></div><div class="pager"><button id="prev">Anterior</button><span id="pageLabel"></span><button id="next">Seguinte</button></div></main></div><div id="detailOverlay" class="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detailName"><div class="detail-panel"><button id="detailClose" class="detail-close" aria-label="Fechar ficha">×</button><div id="detailContent"></div></div></div><script>let records=[];let currentPage=0;const $=x=>document.getElementById(x);const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const list=(v)=>Array.isArray(v)?v:[];function openDetail(r){const target=$('detailContent');target.replaceChildren();const heading=document.createElement('h2');heading.id='detailName';heading.textContent=r.nome;target.append(heading);if(r.foto){const photo=document.createElement('img');photo.src=r.foto;photo.alt='Fotografia de '+r.nome;photo.onerror=()=>photo.remove();target.append(photo)}for(const [label,value] of [['Área / profissão',list(r.areas).join(', ')],['Cemitério',list(r.cemiterios).join(', ')],['Nascimento',r.nascimento],['Morte',r.morte],['Rotas temáticas',list(r.rotas).join(', ')],['Biografia',r.biografia]]){if(!value)continue;const div=document.createElement('div');div.className='detail-row';const b=document.createElement('strong');b.textContent=label;const p=document.createElement('p');p.textContent=value;div.append(b,p);target.append(div)}for(const [label,value] of Object.entries(r.detalhes||{})){if(!value||['Nome','Área','Cemitério','Rota','Data de nascimento','Data de morte'].includes(label))continue;const div=document.createElement('div');div.className='detail-row';const b=document.createElement('strong');b.textContent=label;const p=document.createElement('p');p.textContent=value;div.append(b,p);target.append(div)}$('detailOverlay').classList.add('open');$('detailClose').focus()}function closeDetail(){$('detailOverlay').classList.remove('open')} function year(v){const m=String(v||'').match(/\b(1[0-9]{3}|20[0-9]{2})\b/);return m?+m[1]:null}function fits(y,a,b){return !a&&!b||y!==null&&(!a||y>=+a)&&(!b||y<=+b)}function fill(id,key){for(const x of [...new Set(records.flatMap(r=>list(r[key])))].sort()){const o=document.createElement('option');o.value=x;o.textContent=x;$(id).append(o)}}function render(){const data=records.filter(r=>norm(r.nome).includes(norm($('nome').value))&&(!$('area').value||$('area').value==='Todas'||list(r.areas).includes($('area').value))&&(!$('cem').value||$('cem').value==='Todos'||list(r.cemiterios).includes($('cem').value))&&(!$('rota').value||$('rota').value==='Todas'||list(r.rotas).includes($('rota').value))&&fits(year(r.nascimento),$('n1').value,$('n2').value)&&fits(year(r.morte),$('m1').value,$('m2').value));$('status').textContent=data.length+' de '+records.length+' registos disponíveis';const perPage=innerWidth<=700?4:6;const totalPages=Math.max(1,Math.ceil(data.length/perPage));currentPage=Math.min(currentPage,totalPages-1);$('pageLabel').textContent=(currentPage+1)+' / '+totalPages;$('prev').disabled=currentPage===0;$('next').disabled=currentPage>=totalPages-1;$('results').replaceChildren();for(const r of data.slice(currentPage*perPage,(currentPage+1)*perPage)){const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Abrir ficha de '+r.nome);card.addEventListener('click',()=>openDetail(r));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDetail(r)}});const pic=document.createElement('div');pic.className='portrait';pic.textContent='◈';if(r.foto&&(/^(https:\/\/|fotos\/)/.test(r.foto))){const img=document.createElement('img');img.src=r.foto;img.alt='Retrato de '+r.nome;img.style.cssText='width:100%;height:150px;object-fit:cover';pic.replaceChildren(img)}const body=document.createElement('div');body.className='body';const h=document.createElement('h3');h.textContent=r.nome;body.append(h);for(const a of list(r.areas)){const t=document.createElement('span');t.className='tag';t.textContent=a;body.append(t)}const p=document.createElement('p');p.textContent=list(r.cemiterios).join(' · ')||'Cemitério não indicado';body.append(p);const dates=document.createElement('p');dates.textContent=(r.nascimento||'?')+' — '+(r.morte||'?');body.append(dates);card.append(pic,body);$('results').append(card)}}async function init(){try{const res=await fetch('./dados-publicos.json',{cache:'no-store'});if(!res.ok)throw Error('Sem ficheiro de dados');const data=await res.json();if(!Array.isArray(data))throw Error('Formato inválido');records=data;fill('area','areas');fill('cem','cemiterios');fill('rota','rotas');render()}catch(e){$('status').textContent='A interface está publicada. A ligação segura aos registos do Notion ainda não foi configurada. Não são apresentados dados fictícios.'}}for(const id of ['nome','area','cem','rota','n1','n2','m1','m2'])$(id).addEventListener('input',()=>{currentPage=0;render()});$('prev').onclick=()=>{currentPage--;render()};$('next').onclick=()=>{currentPage++;render()};$('detailClose').onclick=closeDetail;$('detailOverlay').onclick=e=>{if(e.target===$('detailOverlay'))closeDetail()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});$('clear').onclick=()=>{for(const id of ['nome','area','cem','rota','n1','n2','m1','m2'])$(id).value='';render()};init();</script></html>

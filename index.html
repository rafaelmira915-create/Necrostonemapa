<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Necrostone · Mapa Cemiterial</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;min-height:460px;display:flex;flex-direction:column;font:15px system-ui,-apple-system,sans-serif;background:#080808;color:#f5f5f5}
header{display:flex;align-items:center;gap:24px;padding:12px 28px;background:#050505;border-bottom:1px solid #333;flex-shrink:0}
.brand-logo{width:104px;height:104px;object-fit:contain;display:block;flex-shrink:0}
.header-copy{min-width:0}.eyebrow{display:block;font-size:10px;letter-spacing:.22em;color:#aaa;margin-bottom:7px}
h1{font:400 clamp(22px,2.4vw,32px) Georgia,serif;margin:0 0 7px;letter-spacing:.01em}
header small{display:block;font-size:12px;line-height:1.5;color:#aaa;max-width:640px}
main{display:flex;flex:1;min-height:0}
aside{width:340px;flex-shrink:0;padding:20px;overflow:auto;background:#151515;border-right:1px solid #383838}
input,button{font:inherit;padding:11px;border:1px solid #777;border-radius:5px;background:#f7f7f7;color:#111;width:100%;margin:5px 0}
input::placeholder{color:#666}button{cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
button:hover{background:#ddd}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}
#map{flex:1;min-width:0;background:#f4f4f4}
#status,small{font-size:13px;line-height:1.55;color:#bdbdbd}
#results button{background:#242424;color:#f5f5f5;border:1px solid #555}
#results button:hover{background:#363636;border-color:#aaa}
a{color:#eee;text-underline-offset:3px}
.lisbon-link{display:block;padding:11px 12px;margin-bottom:18px;border:1px solid #888;border-radius:5px;text-decoration:none;background:#eee;color:#111;font-size:13px}.record-photo{margin:14px 0}.record-photo img{width:100%;height:auto;max-height:220px;object-fit:cover;border-radius:4px;display:block}.record-photo figcaption{font-size:11px;line-height:1.45;color:#aaa;margin-top:6px}.record-note{font-size:12px;color:#bbb;line-height:1.5}.record-links{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:14px}nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:18px}
nav button{width:auto;padding:6px 9px;font-size:12px;background:#303030;color:#fff;border-color:#666}
nav button:hover{background:#484848}
h2{font-size:18px;font-weight:500}
.detail{background:#080808;padding:16px;border:1px solid #555;border-radius:6px;margin-top:16px}
.detail p{margin:9px 0}
#detail:empty{display:none}
#retry{display:none}
.photo-marker-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}.photo-marker-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.photo-marker-lines line{stroke:#333;stroke-width:1;stroke-opacity:.7}.photo-marker-layer .photo-marker{position:absolute;pointer-events:auto;width:48px;height:42px;margin:0;padding:2px;border:1px solid #222;border-radius:5px;background:#fff;box-shadow:0 2px 7px #0004;overflow:hidden}.photo-marker img{display:block;width:100%;height:100%;object-fit:cover}.photo-marker-layer .photo-marker:hover,.photo-marker-layer .photo-marker:focus-visible{z-index:1;outline:2px solid #111;outline-offset:2px}
.map-photo{position:absolute;z-index:3;width:min(260px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fff;color:#111;border:1px solid #333;border-radius:7px;box-shadow:0 6px 24px #0003}
.map-photo img{width:100%;height:150px;object-fit:cover;display:block}
.map-photo h2{font-size:15px;line-height:1.35;margin:11px 13px 7px;padding-right:8px}
.map-photo p{font-size:10px;line-height:1.45;color:#555;margin:0 13px 12px}
.map-photo a{color:#222}.map-photo .map-photo-close{position:absolute;right:7px;top:7px;width:28px;height:28px;margin:0;padding:0;line-height:24px;text-align:center;border:1px solid #888;border-radius:50%;background:#fff;color:#111;font-size:22px;z-index:1}
@media(max-width:650px){.map-photo{width:min(220px,calc(100% - 24px))}.map-photo img{height:110px}}
.maplibregl-popup-content{color:#111;background:#fff;border:1px solid #555;border-radius:5px}
.maplibregl-popup-close-button{width:24px;margin:0;padding:2px;border:0;background:transparent}
.maplibregl-ctrl-group button{margin:0;padding:0;border-radius:0}
.maplibregl-ctrl-attrib{color:#222}.maplibregl-ctrl-attrib a{color:#222}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important}}
@media(max-width:650px){
header{gap:14px;padding:9px 16px}.brand-logo{width:78px;height:78px}
h1{font-size:23px;margin-bottom:4px}.eyebrow{font-size:9px;margin-bottom:4px}header small{font-size:10px}
main{flex-direction:column}aside{width:100%;flex:0 0 43%;min-height:175px;padding:14px 16px;border-right:0;border-bottom:1px solid #444}
#map{flex:1;min-height:150px}
}

function clearMapPhoto(){if(mapPhoto){mapPhoto.element.remove();mapPhoto=null}}
function positionMapPhoto(){
 if(!mapPhoto)return;
 const host=document.querySelector('#map'),card=mapPhoto.element,p=map.project(displayCoordinate(mapPhoto.coordinates));
 const width=card.offsetWidth,height=card.offsetHeight,w=host.clientWidth,h=host.clientHeight;
 const clamp=(v,min,max)=>Math.min(Math.max(v,min),Math.max(min,max));
 const x=clamp(p.x-width/2,12,w-width-12),above=p.y-height-16;
 const y=above>=12?above:clamp(p.y+16,12,h-height-12);
 card.style.left=x+'px';card.style.top=y+'px';
}
function showMapPhoto(c){
 if(!c.photo?.url)return;
 const card=document.createElement('section');card.className='map-photo';card.setAttribute('aria-label','Fotografia de '+c.name);
 const close=document.createElement('button');close.className='map-photo-close';close.type='button';close.textContent='×';close.setAttribute('aria-label','Fechar fotografia');close.onclick=clearMapPhoto;card.append(close);
 const image=document.createElement('img');image.src=c.photo.url;image.alt=c.photo.caption||c.name;image.referrerPolicy='no-referrer';image.onload=positionMapPhoto;image.onerror=()=>{image.hidden=true};card.append(image);
 const title=document.createElement('h2');title.textContent=c.name;card.append(title);
 
 card.addEventListener('click',e=>e.stopPropagation());document.querySelector('#map').append(card);mapPhoto={element:card,coordinates:c.feature.geometry.coordinates};positionMapPhoto();
}
map.on('move',positionMapPhoto);map.on('resize',positionMapPhoto);
function select(x){if(state.loading)return;if(!x.cemetery&&(state.path.length<3||x.azoresGroup||x.madeiraGroup)){go([...state.path,x]);return}if(popup)popup.remove();clearMapPhoto();fit(x.feature);if(x.fromNotion){const record={name:x.parish,municipality:x.municipality,notionUrl:x.notionUrl};showRecord(record,x);showMapPhoto(x);return}const box=$('#detail');box.replaceChildren();box.className='detail';const h=document.createElement('h2');h.textContent=x.name;box.append(h);for(const text of ['Descrição: '+(x.summary||'Não disponível'),'Área: '+(x.areaM2!=null?new Intl.NumberFormat('pt-PT').format(x.areaM2)+' m²':'Por confirmar'),'Ano de inauguração: '+(x.year??'Por confirmar'),'Visita 360°: '+(x.visit360Url?'Sim':'Não')]){const p=document.createElement('p');p.textContent=text;box.append(p)}if(!map.svgFallback)popup=new maplibregl.Popup().setLngLat(displayCoordinate(x.feature.geometry.coordinates)).setText(x.name).addTo(map)}

search.oninput=()=>{if(!state.loading)render()};$('#retry').onclick=()=>go(state.path);
map.on('load',()=>{for(const id of ['context','areas','points','labels'])map.addSource(id,{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'context-fill',type:'fill',source:'context',paint:{'fill-color':'#bcbcbc','fill-opacity':.18}});map.addLayer({id:'context-line',type:'line',source:'context',paint:{'line-color':'#333333','line-width':2}});map.addLayer({id:'fill',type:'fill',source:'areas',paint:{'fill-color':'#bcbcbc','fill-opacity':.65}});map.addLayer({id:'lines',type:'line',source:'areas',paint:{'line-color':'#333333','line-width':1.3}});map.addLayer({id:'area-labels',type:'symbol',source:'labels',layout:{'text-field':['get','name'],'text-size':12,'text-font':['Open Sans Regular','Arial Unicode MS Regular'],'text-allow-overlap':false,'text-padding':4},paint:{'text-color':'#333333','text-opacity':0.72,'text-halo-color':'#f4f4f4','text-halo-width':1.3}});map.addLayer({id:'cemeteries',type:'circle',source:'points',paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,3,12,4,16,6],'circle-color':'#111111','circle-stroke-color':'#fff','circle-stroke-width':1.2}});map.on('click',e=>{if(state.loading)return;const hits=map.queryRenderedFeatures(e.point,{layers:['cemeteries','fill']});const hit=hits.find(f=>f.layer.id==='cemeteries')||hits[0];const i=hit?.properties?._index;if(i!=null&&state.items[i])select(state.items[i])});for(const layer of ['fill','cemeteries']){map.on('mouseenter',layer,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',layer,()=>map.getCanvas().style.cursor='')}if(typeof location!=='undefined'&&new URLSearchParams(location.search).get('concelho'))openLisbon();else if(['lisboa','porto'].includes(norm(new URLSearchParams(location.search).get('distrito')))){const name=norm(new URLSearchParams(location.search).get('distrito'))==='porto'?'Porto':'Lisboa';go([{name}]).then(()=>{if(state.path.length!==1||norm(state.path[0]?.name)!==norm(name)||!state.items.length)return;const bs=state.items.filter(x=>x.feature).map(x=>bounds(x.feature));if(bs.length)map.fitBounds([[Math.min(...bs.map(b=>b[0][0])),Math.min(...bs.map(b=>b[0][1]))],[Math.max(...bs.map(b=>b[1][0])),Math.max(...bs.map(b=>b[1][1]))]],{padding:35,duration:500})})}else go([])});
map.on('error',e=>{if(!map.isStyleLoaded())status.textContent='Não foi possível iniciar o mapa. Recarrega a página.'});
</script></body></html>

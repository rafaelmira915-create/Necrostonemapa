<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Necrostone — Mapa de Portugal</title><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#13201f;color:#f6f1e8}header{padding:12px 18px}h1{font-size:21px;margin:0}main{display:flex;height:calc(100dvh - 55px)}aside{width:300px;padding:16px;overflow:auto;background:#20302d}input,button{padding:11px;border:1px solid #87958c;border-radius:6px;background:#f8f5eb;color:#16231f;width:100%;margin:6px 0}button{cursor:pointer;text-align:left}#map{flex:1;min-width:0}#status{font-size:13px;color:#c4d1c8}#results button{background:#314840;color:#fff;border:0}a{color:#d9eadc}@media(max-width:650px){main{flex-direction:column}aside{width:100%;height:37%;min-height:205px}#map{height:63%}}</style></head><body><header><h1>Necrostone · Mapa Cemiterial</h1></header><main><aside><input id="search" placeholder="Pesquisar região ou município" aria-label="Pesquisar"><button id="back">← Portugal</button><p id="status">A carregar cartografia administrativa…</p><div id="results"></div><p><small>Protótipo cartográfico. Ainda sem dados de cemitérios do Notion. As regiões autónomas aparecem na sua posição geográfica.</small></p></aside><div id="map"></div></main><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{},layers:[{id:'background',type:'background',paint:{'background-color':'#dce6e0'}}]},center:[-11.2,38.8],zoom:4.6});
map.addControl(new maplibregl.NavigationControl(),'top-right');
const status=document.querySelector('#status'),results=document.querySelector('#results'),search=document.querySelector('#search');
let features=[],level=1;
const bounds=f=>{const pts=[];const walk=x=>{if(typeof x[0]==='number')pts.push(x);else x.forEach(walk)};f.geometry.coordinates.forEach(walk);return pts.reduce((b,p)=>[[Math.min(b[0][0],p[0]),Math.min(b[0][1],p[1])],[Math.max(b[1][0],p[0]),Math.max(b[1][1],p[1])]],[ [180,90],[-180,-90] ])};
function show(f){map.fitBounds(bounds(f),{padding:45,maxZoom:9});}
function renderList(q=''){results.replaceChildren();const matches=features.filter(f=>String(f.properties.shapeName||'').toLocaleLowerCase('pt').includes(q.toLocaleLowerCase('pt'))).slice(0,100);for(const f of matches){const b=document.createElement('button');b.textContent=f.properties.shapeName||'Sem nome';b.onclick=()=>show(f);results.append(b)}}
async function load(adm){level=adm;status.textContent='A carregar limites administrativos…';try{const meta=await fetch('https://www.geoboundaries.org/api/current/gbOpen/PRT/ADM'+adm).then(r=>{if(!r.ok)throw Error('API '+r.status);return r.json()});const geo=await fetch(meta.simplifiedGeometryGeoJSON||meta.gjDownloadURL).then(r=>{if(!r.ok)throw Error('Cartografia indisponível');return r.json()});features=geo.features;const source=map.getSource('areas');if(source)source.setData(geo);else{map.addSource('areas',{type:'geojson',data:geo});map.addLayer({id:'fill',type:'fill',source:'areas',paint:{'fill-color':'#628c76','fill-opacity':0.6}});map.addLayer({id:'lines',type:'line',source:'areas',paint:{'line-color':'#203f33','line-width':1}})}status.textContent=(adm===1?'Regiões/distritos':'Municípios')+': '+features.length+' áreas. Clica numa área para aproximar.';renderList(search.value)}catch(e){status.textContent='Não foi possível carregar a cartografia: '+e.message}}
map.on('load',()=>load(1));map.on('click','fill',e=>{if(e.features?.length){const f=e.features[0];show(f);status.textContent=(f.properties.shapeName||'Área')+' · selecionada. '+(level===1?'Usa «Ver municípios» para mudar de nível.':'')}});map.on('mouseenter','fill',()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave','fill',()=>map.getCanvas().style.cursor='');search.oninput=()=>renderList(search.value);document.querySelector('#back').onclick=()=>{map.flyTo({center:[-11.2,38.8],zoom:4.6});load(1)};
const b=document.createElement('button');b.textContent='Ver municípios';b.onclick=()=>load(2);document.querySelector('aside').insertBefore(b,status);
</script></body></html>

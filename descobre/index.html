<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Necrostone · Descobre uma personalidade</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:min(650px,100%);text-align:center}.brand{font:12px system-ui;letter-spacing:.25em;color:#aaa}h1{font:normal clamp(30px,6vw,48px) Georgia,serif}button{background:#eee;border:0;border-radius:3px;padding:16px 30px;font-size:16px;cursor:pointer}article{margin:30px 0;padding:30px;border:1px solid #444;text-align:left;background:#131313;min-height:180px}h2{font:normal 29px Georgia,serif;margin-top:0}p{line-height:1.65}.meta{color:#bbb;font-size:14px}a{color:#ddd}small{color:#888;display:block;margin-top:28px}</style></head><body><main><div class="brand">NECROSTONE · ARQUIVO CEMITERIAL DIGITAL</div><h1>Descobre uma personalidade</h1><p>Um encontro inesperado com a história.</p><button id="pick">Surpreende-me</button><article id="card" aria-live="polite"><p>Carrega no botão para descobrir uma personalidade.</p></article><small>Versão de teste com fichas verificadas do Notion. A sincronização integral do arquivo ainda não está ativa.</small></main><script>const people=[{"nome":"Carlos Wallenstein","bio":"Ator, encenador e diretor teatral português, com carreira no teatro, cinema, rádio e televisão.","nasc":"1926","morte":"1990","cemiterio":"Cemitério dos Prazeres","url":"https://app.notion.com/p/3f2f3ddb5a6d80a68fa9e48ef9d7ded3"},{"nome":"Maria do Bom Sucesso Furtado Taveira de Medeiros Franco Wallenstein","bio":"Atriz, professora e tradutora portuguesa. Foi cremada no Cemitério do Alto de São João.","nasc":"17-06-1927","morte":"15-01-2007","cemiterio":"Cremação — Alto de São João","url":"https://app.notion.com/p/40ff3ddb5a6d81d19696cb644506fa02"}];let last=-1;const card=document.getElementById('card');document.getElementById('pick').onclick=()=>{let i=Math.floor(Math.random()*(people.length-1));if(i>=last)i++;last=i;const p=people[i];card.replaceChildren();const h=document.createElement('h2');h.textContent=p.nome;const m=document.createElement('p');m.className='meta';m.textContent=p.nasc+' — '+p.morte+' · '+p.cemiterio;const b=document.createElement('p');b.textContent=p.bio;const a=document.createElement('a');a.href=p.url;a.target='_blank';a.rel='noopener';a.textContent='Consultar ficha no Arquivo Necrostone →';card.append(h,m,b,a)};</script></body></html>
